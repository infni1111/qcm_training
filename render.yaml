# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The app is a static React/Vite SPA (no live backend yet), so it deploys as a
# free Static Site: Render runs the build and serves ./dist from its CDN.
#
# To deploy: push this repo to GitHub, then on the Render dashboard go to
# New > Blueprint and connect the repo. Render reads this file and creates the
# service automatically. Pushes to `main` then trigger auto-deploys.
#
# When Step 2 (the Flask REST API) lands, switch this to a web service:
#   type: web / runtime: python / startCommand: gunicorn server:app
# and add gunicorn to a requirements.txt.
services:
  - type: web
    name: qcm-training
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Pin Node so the Vite 5 build matches what we test locally.
      - key: NODE_VERSION
        value: "20"
    # SPA fallback: serve index.html for any path so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
